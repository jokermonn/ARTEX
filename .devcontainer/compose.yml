name: artex-codespaces
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: artex
      POSTGRES_DB: artex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先运行 prepare.sh}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artex -d artex"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  artex:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    environment:
      ARTEX_PG_DSN: postgres://artex:${POSTGRES_PASSWORD}@postgres:5432/artex?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ../.codespaces-local/data:/app/data
      - ../skills:/app/skills
    restart: unless-stopped
volumes:
  pgdata:
